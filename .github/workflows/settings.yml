name: Einstellungen übernehmen

# Ausgelöst von den Formularen in den Einstellungen der Seite: Sie öffnen ein Issue mit dem
# Titel «Quelle: …», «Quelle entfernen: …», «Thema: …», «Suchbegriff: …» oder «Regeln: …».
# Nur Issues des Repo-Inhabers werden verarbeitet.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    if: >-
      github.event.issue.user.login == github.repository_owner && (
        startsWith(github.event.issue.title, 'Quelle:') ||
        startsWith(github.event.issue.title, 'Quelle entfernen:') ||
        startsWith(github.event.issue.title, 'Thema:') ||
        startsWith(github.event.issue.title, 'Suchbegriff:') ||
        startsWith(github.event.issue.title, 'Regeln:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: apply
        name: Änderung in sources.yaml übernehmen
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python apply_issue.py

      - if: steps.apply.outputs.status == 'ok'
        name: Änderung committen
        env:
          SUMMARY: ${{ steps.apply.outputs.summary }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.yaml
          git commit -m "$SUMMARY (#$NUMBER)"
          git push

      # Ein Push mit dem Action-Token startet keine weiteren Workflows, deshalb den Bau direkt anstossen
      - if: steps.apply.outputs.status == 'ok'
        name: Seite neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY"

      - if: always()
        name: Ergebnis ins Issue schreiben
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.apply.outputs.message || 'Es ist ein Fehler aufgetreten, Details im Action-Log.' }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$MESSAGE"
