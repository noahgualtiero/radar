# Quellen des Paid Search Newsfeeds.
# Neue Quellen werden NUR hier ergänzt (siehe README).
#
# Felder je Quelle:
#   name:            Anzeigename auf der Karte und im Quellen-Filter
#   url:             RSS- oder Atom-Feed-URL
#   kategorie:       eine der Kategorien unten
#   nur_kategorien:  optional – nur Artikel übernehmen, deren Feed-Kategorie
#                    einem dieser Begriffe entspricht (Gross/klein egal)
#   nur_begriffe:    optional – nur Artikel übernehmen, deren Titel oder Anriss einen
#                    dieser Begriffe enthält (für breite Marketing-Medien, z.B. *paid)
#   aktiv:           optional – false blendet die Quelle aus, ohne sie zu löschen
#
# Alle Quellen sind gratis: offene RSS-Feeds, Google News, arXiv und OpenAlex.

kategorien:
  - Offiziell
  - News
  - Studien
  - DACH
  - LinkedIn
  - Community   # Foren wie Reddit
  - Entdecken   # Treffer der Suchbegriffe unten
  - Forschung   # wissenschaftliche Arbeiten, siehe "forschung" unten

# Themenbereiche: Jeder Artikel erhält die Themen, deren Stichwörter in Titel oder Anriss
# vorkommen (Gross/klein egal). Leerzeichen um ein Stichwort verhindern Teiltreffer,
# z.B. " ki " trifft nicht "Kiosk". Themen erscheinen als Filter und als #Tags.
themen:
  - name: Google Ads
    stichwoerter: [google ads, performance max, pmax, demand gen, ai max, responsive search ad, " rsa ", search campaign, youtube ads]
  - name: Microsoft Ads
    stichwoerter: [microsoft advertising, microsoft ads, bing ads, copilot ads]
  - name: Shopping & Feeds
    stichwoerter: [shopping, merchant center, product feed, produktfeed, feed-optimierung, " gmc "]
  - name: KI-Suche & ChatGPT Ads
    stichwoerter: [chatgpt, openai, ai overview, ai mode, gemini, perplexity, llm, " ki ", " ai ", agentic, generative]
  - name: Gebote & Budgets
    stichwoerter: [bidding, gebot, auction, auktion, autobidding, troas, tcpa, target roas, target cpa, budget]
  - name: Tracking & Messung
    stichwoerter: [tracking, consent, conversion, attribution, incrementality, measurement, messung, ga4, server-side, enhanced conversions, meridian]
  - name: Retail Media
    stichwoerter: [retail media, amazon ads, sponsored products, sponsored brands, commerce media]
  - name: Richtlinien & Recht
    stichwoerter: [policy, richtlinie, dsgvo, gdpr, dma, lawsuit, klage, antitrust, kartell, regulation]

# Begriffe, mit denen breite Marketing-Medien auf Paid Search eingeschränkt werden
paid_begriffe: &paid
  - google ads
  - search ads
  - suchmaschinenwerbung
  - suchmaschinenmarketing
  - paid search
  - " sea "
  - " sea-"
  - performance max
  - demand gen
  - microsoft advertising
  - bing ads
  - google shopping
  - shopping ads
  - merchant center
  - retail media
  - amazon ads
  - " ppc"
  - chatgpt ads
  - chatgpt-werbung
  - werbung in chatgpt
  - ai overviews
  - ai max
  - smart bidding

# Wissenschaftliche Arbeiten. Google Scholar hat weder API noch Feed und darf nicht
# automatisiert abgefragt werden; stattdessen zwei offene Quellen:
#   arxiv:             Preprints (v.a. Informatik/Ökonomie: Auktionen, Autobidding,
#                      Werbesysteme – oft von Google, Meta, Alibaba). Begriff gilt für den Abstract.
#   fachzeitschriften: neue Artikel aus den gelisteten Journals über OpenAlex,
#                      gefiltert auf Titel/Abstract. Journal über die ISSN ergänzen.
#                      nur_open_access: nur Artikel, die frei lesbar sind.
forschung:
  kategorie: Forschung
  arxiv:
    begriffe:
      - '"sponsored search"'
      - '"search advertising"'
      - '"search ads"'
      - '"ad auction"'
      - '"ad auctions"'
      - 'autobidding'
      - '"auto-bidding"'
      - '"paid search"'
      - '"keyword advertising"'
  fachzeitschriften:
    nur_open_access: true
    begriffe:
      - '"search advertising"'
      - '"sponsored search"'
      - '"paid search"'
      - '"search engine"'
      - '"online advertising"'
      - '"digital advertising"'
      - '"advertising auction"'
      - '"keyword advertising"'
      - '"programmatic"'
      - '"retail media"'
      - '"advertising attribution"'
      - '"multi-touch attribution"'
      - '"incrementality"'
    issn:
      - 0022-2429   # Journal of Marketing
      - 0022-2437   # Journal of Marketing Research
      - 0732-2399   # Marketing Science
      - 0025-1909   # Management Science
      - 0021-8499   # Journal of Advertising Research
      - 0091-3367   # Journal of Advertising
      - 0167-8116   # International Journal of Research in Marketing
      - 1094-9968   # Journal of Interactive Marketing
      - 1570-7156   # Quantitative Marketing and Economics

# Suchbegriffe: Für jeden Begriff wird Google News abgefragt. Treffer von Seiten, die
# schon oben als Quelle stehen, werden ausgeblendet – übrig bleibt, was neu ist.
# Unten auf der Seite listet "Unbekannte Quellen" die Domains, die dabei auftauchen.
#   begriff:  Suchanfrage wie bei Google; "…" für exakte Phrase, OR für Alternativen
#   sprache:  en (US-Ausgabe) oder de (Schweizer Ausgabe)
suchen:
  zeitraum_tage: 7
  begriffe:
    - { begriff: '"Google Ads"', sprache: en }
    - { begriff: '"Performance Max"', sprache: en }
    - { begriff: '"Demand Gen" Google', sprache: en }
    - { begriff: '"AI Max" Google', sprache: en }
    - { begriff: '"Smart Bidding"', sprache: en }
    - { begriff: '"Merchant Center"', sprache: en }
    - { begriff: '"Microsoft Advertising"', sprache: en }
    - { begriff: '"ChatGPT ads" OR "ChatGPT advertising"', sprache: en }
    - { begriff: '"paid search" OR "PPC campaign" OR "PPC advertising"', sprache: en }
    - { begriff: '"Google Ads"', sprache: de }
    - { begriff: '"Performance Max"', sprache: de }
    - { begriff: 'Suchmaschinenwerbung OR SEA-Kampagne', sprache: de }
  # Domains, deren Treffer nie angezeigt werden (Rauschen)
  ignorieren:
    - google.com
    - microsoft.com        # Konzern-News, Werbe-Themen kommen über den Ads-Blog
    - guinnessworldrecords.com
    - sylt1.tv
    - tradingview.com      # Börsenmeldungen (Ticker "PPC")

