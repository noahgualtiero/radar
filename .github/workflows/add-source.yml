name: Quelle aufnehmen

# Ausgelöst vom Formular «Quelle aufnehmen» in den Einstellungen der Seite:
# Es öffnet ein Issue «Quelle: <URL>». Nur Issues des Repo-Inhabers werden verarbeitet.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Quelle:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: add
        name: Feed suchen und eintragen
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python add_source.py

      - if: steps.add.outputs.status == 'ok'
        name: Änderung committen
        env:
          NAME: ${{ steps.add.outputs.name }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.yaml
          git commit -m "Quelle aufgenommen: $NAME (#$NUMBER)"
          git push

      # Ein Push mit dem Action-Token startet keine weiteren Workflows, deshalb den Bau direkt anstossen
      - if: steps.add.outputs.status == 'ok'
        name: Seite neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY"

      - if: always()
        name: Ergebnis ins Issue schreiben
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.add.outputs.message || 'Es ist ein Fehler aufgetreten, Details im Action-Log.' }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$MESSAGE"
