# Quellen von Radar (Paid-Search-Newsfeed).
# Neue Quellen werden NUR hier ergänzt (siehe README).
#
# Felder je Quelle:
#   name:            Anzeigename auf der Karte und im Quellen-Filter
#   url:             RSS- oder Atom-Feed-URL
#   kategorie:       eine der Kategorien unten
#   nur_kategorien:  optional – nur Artikel übernehmen, deren Feed-Kategorie
#                    einem dieser Begriffe entspricht (Gross/klein egal)
#   nur_begriffe:    optional – nur Artikel übernehmen, deren Titel oder Anriss einen
#                    dieser Begriffe enthält (für breite Marketing-Medien, z.B. *paid)
#   aktiv:           optional – false blendet die Quelle aus, ohne sie zu löschen
#
# Alle Quellen sind gratis: offene RSS-Feeds und Google News.

# Zugang: einfache Passwort-Sperre vor der Seite. Gespeichert ist nur der SHA-256-Hash.
# Neues Passwort setzen:  printf '%s' 'NEUES-PASSWORT' | shasum -a 256
# Achtung: Das ist ein Vorhang, kein Tresor. Repo und items.json sind öffentlich lesbar.
zugang:
  passwort_sha256: aa60c8150f45ec991c70d83d16f063d4601243a9d0597d6fe8e93a4d53a075b5

kategorien:
  - Offiziell
  - News
  - Studien
  - DACH
  - LinkedIn
  - Community   # Foren wie Reddit – eigener Tab
  - Entdecken   # Treffer der Suchbegriffe unten – eigener Tab

# Themenkatalog: Jeder Beitrag erhält die Themen, deren Stichwörter in Titel oder Anriss
# vorkommen (Gross/klein egal). Leerzeichen um ein Stichwort verhindern Teiltreffer,
# z.B. " ki " trifft nicht "Kiosk". Themen erscheinen als Filter und als #Tags.
#   gewicht: 1 = normal, 2 = wichtig, 3 = sehr wichtig. Wichtige Themen zählen bei
#            "Gestern wichtig" und "Trends" stärker und rücken im Feed etwas nach oben.
themen:
  - name: Google Ads
    gewicht: 3
    stichwoerter: [google ads, performance max, pmax, demand gen, ai max, responsive search ad, " rsa ", search campaign, suchkampagne, broad match, keyword planner]
  - name: KI-Suche & ChatGPT Ads
    gewicht: 3
    stichwoerter: [chatgpt, openai, ai overview, ai mode, gemini, perplexity, copilot, llm, " ki-", " ki ", agentic, generative ai, generative search]
  - name: Gebote & Budgets
    gewicht: 2
    stichwoerter: [bidding, bid strateg, gebot, auction, auktion, autobidding, troas, tcpa, target roas, target cpa, budget, cpc]
  - name: Tracking & Messung
    gewicht: 2
    stichwoerter: [tracking, consent, conversion, attribution, incrementality, measurement, messung, ga4, server-side, enhanced conversions, meridian, " mmm"]
  - name: Shopping & Feeds
    gewicht: 2
    stichwoerter: [shopping, merchant center, product feed, produktfeed, feed-optimierung, " gmc ", product listing]
  - name: Microsoft Ads
    gewicht: 1
    stichwoerter: [microsoft advertising, microsoft ads, bing ads]
  - name: Retail Media
    gewicht: 1
    stichwoerter: [retail media, amazon ads, sponsored products, sponsored brands, commerce media]
  - name: Richtlinien & Recht
    gewicht: 1
    stichwoerter: [policy, policies, richtlinie, dsgvo, gdpr, " dma", lawsuit, klage, antitrust, kartell, regulation, verified]
  - name: Agentur & Strategie
    gewicht: 1
    stichwoerter: [agency, agentur, client, kunde, strategy, strategie, hiring, career, pricing]

# Begriffe, mit denen Beratungs-Feeds auf Marketing-Themen eingegrenzt werden
marketing_begriffe: &marketing
  - marketing
  - advertising
  - " ads "
  - advertiser
  - media
  - search
  - consumer
  - e-commerce
  - ecommerce
  - retail
  - brand
  - customer
  - personalization

# Begriffe, mit denen breite Marketing-Medien auf Paid Search eingeschränkt werden
paid_begriffe: &paid
  - google ads
  - search ads
  - suchmaschinenwerbung
  - suchmaschinenmarketing
  - paid search
  - " sea "
  - " sea-"
  - performance max
  - demand gen
  - microsoft advertising
  - bing ads
  - google shopping
  - shopping ads
  - merchant center
  - retail media
  - amazon ads
  - " ppc"
  - chatgpt ads
  - chatgpt-werbung
  - werbung in chatgpt
  - ai overviews
  - ai max
  - smart bidding

# Suchbegriffe: Für jeden Begriff wird Google News abgefragt. Treffer von Seiten, die
# schon oben als Quelle stehen, werden ausgeblendet – übrig bleibt, was neu ist.
# Unten auf der Seite listet "Unbekannte Quellen" die Domains, die dabei auftauchen.
#   begriff:  Suchanfrage wie bei Google; "…" für exakte Phrase, OR für Alternativen
#   sprache:  en (US-Ausgabe) oder de (Schweizer Ausgabe)
suchen:
  zeitraum_tage: 7
  begriffe:
    - { begriff: '"Google Ads"', sprache: en }
    - { begriff: '"Performance Max"', sprache: en }
    - { begriff: '"Demand Gen" Google', sprache: en }
    - { begriff: '"AI Max" Google', sprache: en }
    - { begriff: '"Smart Bidding"', sprache: en }
    - { begriff: '"Merchant Center"', sprache: en }
    - { begriff: '"Microsoft Advertising"', sprache: en }
    - { begriff: '"ChatGPT ads" OR "ChatGPT advertising"', sprache: en }
    - { begriff: '"paid search" OR "PPC campaign" OR "PPC advertising"', sprache: en }
    - { begriff: '"Google Ads"', sprache: de }
    - { begriff: '"Performance Max"', sprache: de }
    - { begriff: 'Suchmaschinenwerbung OR SEA-Kampagne', sprache: de }
  # Domains, deren Treffer nie angezeigt werden (Rauschen)
  ignorieren:
    - google.com
    - microsoft.com        # Konzern-News, Werbe-Themen kommen über den Ads-Blog
    - guinnessworldrecords.com
    - sylt1.tv
    - tradingview.com      # Börsenmeldungen (Ticker "PPC")

