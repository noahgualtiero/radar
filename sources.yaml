# Quellen von Radar (Paid-Search-Newsfeed).
# Neue Quellen werden NUR hier ergänzt (siehe README).
#
# Felder je Quelle:
#   name:            Anzeigename auf der Karte und im Quellen-Filter
#   url:             RSS- oder Atom-Feed-URL
#   kategorie:       eine der Kategorien unten
#   aktiv:           optional – false: wird nicht mehr abgerufen
#   standard:        optional – false: nur im Feed von Personen, die sie selbst anschalten
#                    (so legt Radar Quellen an, die jemand in der App aufnimmt)
#
# Jede Person wählt im Tab «Quellen» selbst, welche Quellen in ihrem Feed stehen. Abgerufen
# werden alle aktiven Quellen; das Briefing entsteht aus allen.
#
# Pro Quelle gibt es bewusst keine Sonderregeln: Was im Feed erscheint, bestimmen die
# Regeln unten (für alle Quellen gleich) und der Themenkatalog. Liefert eine Quelle damit
# nichts Brauchbares, wird sie entfernt.
#
# Alle Quellen sind gratis: offene RSS-Feeds und Google News.

# Diese Datei ist die Grundeinstellung. Sobald in Radar (Tab «Quellen») etwas geändert wird,
# gelten die Einstellungen aus der Datenbank; neue Abschnitte von hier werden dort ergänzt.

kategorien:
  - Offiziell
  - News
  - Studien
  - DACH
  - LinkedIn
  - Community   # Foren wie Reddit – erscheint im Tab «Entdecken» als Diskussion
  - Entdecken   # Treffer der Suchbegriffe und der KI-Websuche – Tab «Entdecken»

# Was angezeigt wird (fest voreingestellt, nur hier änderbar).
#   feed_mindest_relevanz:      Feed zeigt Beiträge ab dieser KI-Relevanz (1 = alles … 5 = nur «muss man wissen»)
#   entdecken_mindest_relevanz: dasselbe für Suchfunde in «Entdecken»
# Immer, für alle Quellen gleich: Stellenanzeigen ausblenden, Titel mit weniger als min_woerter Wörtern
# weglassen (z.B. Glossar-Einträge), Titel mit Begriffen aus ausschliessen weglassen.
regeln:
  feed_mindest_relevanz: 2
  entdecken_mindest_relevanz: 3
  min_woerter: 5
  ausschliessen: []

# Themenkatalog: Die KI ordnet jedem Beitrag 0 bis 3 dieser Themen zu. Die Stichwörter sind
# Beispiele, die der KI helfen, und Ersatz, falls die KI einen Beitrag nicht einordnen konnte
# (dann zählt: Stichwort steht in Titel oder Anriss; Leerzeichen um ein Stichwort verhindern
# Teiltreffer, z.B. " ki " trifft nicht "Kiosk"). Themen erscheinen als Chips und #Tags.
#   gewicht: 1 = normal, 2 = wichtig, 3 = sehr wichtig. Wichtige Themen rücken im Feed etwas
#            nach oben und zählen im Briefing stärker.
themen:
  - name: Google Ads
    gewicht: 3
    stichwoerter: [google ads, performance max, pmax, demand gen, ai max, responsive search ad, " rsa ", search campaign, suchkampagne, broad match, keyword planner]
  - name: KI-Suche & ChatGPT Ads
    gewicht: 3
    stichwoerter: [chatgpt, openai, ai overview, ai mode, gemini, perplexity, copilot, " llm", ai search, ki-suche, generative search, agentic commerce, answer engine]
  - name: Gebote & Budgets
    gewicht: 2
    stichwoerter: [bidding, bid strateg, " gebote", gebotsstrateg, auction, auktion, autobidding, troas, tcpa, target roas, target cpa, " budget", " cpc"]
  - name: Tracking & Messung
    gewicht: 2
    stichwoerter: [tracking, consent, conversion, attribution, incrementality, measurement, messung, ga4, server-side, enhanced conversions, meridian, " mmm"]
  - name: Shopping & Feeds
    gewicht: 2
    stichwoerter: [shopping, merchant center, product feed, produktfeed, feed-optimierung, " gmc ", product listing]
  - name: Microsoft Ads
    gewicht: 1
    stichwoerter: [microsoft advertising, microsoft ads, bing ads]
  - name: Retail Media
    gewicht: 1
    stichwoerter: [retail media, amazon ads, sponsored products, sponsored brands, commerce media]
  - name: Richtlinien & Recht
    gewicht: 1
    stichwoerter: [ads policy, advertising policy, policy update, policies, richtlinie, dsgvo, gdpr, " dma ", antitrust, kartell, lawsuit, regulation, verified]
  - name: Agentur & Strategie
    gewicht: 1
    stichwoerter: [ppc agency, paid search agency, sea-agentur, in-house, inhouse, account audit, kontoaudit, client reporting]

# KI über die OpenAI-API (Schlüssel als Secret OPENAI_API_KEY). Ohne Schlüssel läuft Radar ohne KI.
#   einordnen: jeder neue Beitrag einmal (Typ und Relevanz 1–5), viele Beiträge pro Aufruf
#   briefing:  einmal pro Tag aus den relevantesten Beiträgen des Vortags
#   websuche:  alle websuche_alle_tage Tage eine Websuche nach Studien, Kennzahlen, Best Practices
# Preise in USD pro 1 Mio. Tokens [Eingabe, Ausgabe], laut openai.com/api/pricing – bei Modellwechsel
# nachführen; sie dienen nur der Kostenkontrolle. Ist budget_monat_usd erreicht, pausiert die KI bis
# zum Monatsende.
ki:
  budget_monat_usd: 5
  modelle:
    einordnung: gpt-5.4-nano
    briefing: gpt-5.4-mini
    websuche: gpt-5.4-mini
  denkaufwand:          # low hält Antwortzeit und Kosten tief
    einordnung: low
    briefing: low
    websuche: low
  preise_usd_pro_mio_tokens:
    gpt-5.4-nano: [0.20, 1.25]
    gpt-5.4-mini: [0.75, 4.50]
  websuche_usd_pro_aufruf: 0.01
  websuche_alle_tage: 7          # 0 = keine KI-Websuche (Google-News-Suchen laufen trotzdem)
  einordnung_max_pro_lauf: 300
  briefing_artikel: 25            # so viele relevanteste Beiträge bekommt die KI fürs Briefing

# Reihenfolge in Feed und Entdecken: zuerst das Datum (neuster Tag oben), innerhalb eines Tages
# die Relevanz. Diese setzt sich zusammen aus KI-Relevanz, Votes und Klicks des Teams (am Artikel und
# im 30-Tage-Schnitt der Quelle) und dem Themen-Gewicht, mit diesen Gewichten:
gewichtung:
  vote: 2                     # ein Daumen zählt so viel wie …
  klick: 0.5                  # … vier Klicks
  artikel: 0.2                # Anteil der Votes/Klicks am Artikel selbst
  quelle: 0.25                # Anteil des 30-Tage-Schnitts der Quelle
  thema: 0.08                 # pro Gewichtsstufe des Themas
  relevanz: 0.1               # pro KI-Relevanzstufe über bzw. unter 3

# Vorschläge oben im Feed, für jede Person aus ihrem eigenen Verhalten
vorschlaege:
  aufnehmen_ab_artikeln: 3        # Suchfunde einer Website, die ich in 30 Tagen geöffnet oder hochgevotet habe
  entfernen_ab_votes: 3           # Quelle, die ich in 30 Tagen so oft bewertet habe, mit negativem Saldo
  entfernen_ohne_klick_tage: 60   # Quelle, die ich so lange nicht geöffnet habe

# Suchen für «Entdecken»: Radar sucht zu jedem Thema oben automatisch in Google News (gratis),
# mit den ersten typischen Begriffen des Themas: einmal nach Neuigkeiten, einmal nach Studien und
# Kennzahlen. Dazu kommen diese festen Zusatzsuchen. Treffer
# von Seiten, die schon Quelle sind, werden ausgeblendet. Ausgaben unter regionen (DE, AT, CH;
# möglich auch US, UK, IE); die englischsprachigen Fachmedien sind ohnehin feste Quellen.
# Ein Eintrag ist Text oder name (Anzeige) plus q (Suchanfrage wie bei Google: "…", OR).
suchen:
  zeitraum_tage: 7
  regionen: [DE, AT, CH]
  begriffe:
    - name: Beratungen (McKinsey, BCG, Gartner, Forrester, Think with Google)
      q: '(site:mckinsey.com OR site:bcg.com OR site:gartner.com OR site:forrester.com OR site:thinkwithgoogle.com) (advertising OR "paid search" OR "retail media" OR "digital marketing" OR Werbung)'
    - 'Suchmaschinenwerbung OR SEA-Kampagne'
  ignorieren:   # Domains, deren Treffer nie angezeigt werden (Rauschen)
    - google.com
    - microsoft.com        # Konzern-News, Werbe-Themen kommen über den Ads-Blog
    - guinnessworldrecords.com
    - sylt1.tv
    - tradingview.com      # Börsenmeldungen (Ticker "PPC")

